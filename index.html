<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <title>Visual Graph Algorithms</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- TOP BAR -->
    <div id="topbar">
        <div id="app-title">Visual <span>Graph</span> Algorithms</div>

        <button class="algo-btn active" data-algo="dijkstra">DIJKSTRA</button>
        <button class="algo-btn" data-algo="bellman-ford">BELLMAN–FORD</button>
        <button class="algo-btn" data-algo="prim">PRIM</button>
        <button class="algo-btn" data-algo="kruskal">KRUSKAL</button>

        <div class="topbar-divider"></div>

        <div id="start-node-group">
            <label>START</label>
            <input id="start-node-input" type="number" min="0" placeholder="id" />
        </div>

        <div class="topbar-divider" id="start-divider"></div>

        <button id="run-btn">▶ RUN</button>

        <span id="active-algo-label">DIJKSTRA</span>
    </div>

    <!-- MAIN -->
    <div id="main">

        <!-- GRAPH CANVAS -->
        <div id="graph-container">
            <svg id="graph-svg">
                <defs>
                    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                        <polygon points="0 0, 8 3, 0 6" fill="#555" />
                    </marker>
                </defs>
                <g id="edges-layer"></g>
                <g id="nodes-layer"></g>
            </svg>
        </div>

        <!-- RESULT PANEL -->
        <div id="result-panel">
            <div id="result-panel-header">
                <span>OUTPUT</span>
                <button id="clear-btn">CLEAR</button>
            </div>
            <div id="result-content">
                <p class="result-empty">Run an algorithm<br>to see results here.</p>
            </div>
        </div>

    </div>

    <!-- STATUS BAR -->
    <div id="statusbar">
        <span class="status-item">NODES <b id="stat-nodes">0</b></span>
        <span class="status-item">EDGES <b id="stat-edges">0</b></span>
        <span class="status-item">LEFT CLICK — add node &nbsp;·&nbsp; RIGHT DRAG — add edge &nbsp;·&nbsp; RIGHT CLICK node — remove</span>
    </div>

    <!-- WEIGHT MODAL -->
    <div id="weight-modal">
        <div id="weight-modal-box">
            <h6>EDGE WEIGHT</h6>
            <input id="weight-input" type="number" min="1" placeholder="Enter weight..." autofocus />
            <div class="modal-btns">
                <button id="weight-confirm">CONFIRM</button>
                <button id="weight-cancel">CANCEL</button>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/dijkstra.js"></script>
    <script src="js/bellmanFord.js"></script>
    <script src="js/kruskal.js"></script>
    <script src="js/prim.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
