<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <title>Visual Graph Algorithms</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

    <!-- TOP BAR -->
    <div id="topbar">
        <div id="app-title">Visual <span>Graph</span> Algorithms</div>

        <div class="btn-group" id="algo-group">
            <button class="app-btn active" data-algo="dijkstra" title="Dijkstra">DIJKSTRA</button>
            <button class="app-btn" data-algo="bellman-ford" title="Bellman-Ford">BELLMAN–FORD</button>
            <button class="app-btn" data-algo="prim" title="Prim">PRIM</button>
            <button class="app-btn" data-algo="kruskal" title="Kruskal">KRUSKAL</button>
        </div>

        <div class="topbar-divider"></div>

        <div class="btn-group" id="graph-mode-group">
            <button id="mode-undirected" class="app-btn active" title="Undirected mode">UNDIRECTED</button>
            <button id="mode-directed" class="app-btn" title="Directed mode">DIRECTED</button>
        </div>

        <div class="topbar-divider"></div>

        <div id="start-node-group">
            <label>START</label>
            <input id="start-node-input" type="number" min="0" placeholder="id" />
        </div>

        <div class="topbar-divider" id="start-divider"></div>

        <div id="speed-group">
            <label for="speed-slider">SPEED</label>
            <input id="speed-slider" type="range" min="0.25" max="8" step="0.25" value="1" aria-label="Animation speed" />
            <span id="speed-label">1×</span>
        </div>

        <div class="topbar-divider" id="transport-divider"></div>

        <button id="run-btn" title="Run algorithm / stop animation">▶ RUN</button>

        <span id="active-algo-label">DIJKSTRA</span>
    </div>

    <!-- PLAYBACK TRANSPORT (scrubber + reverse). Shown while an animation is
         in progress and kept open after it finishes for review/rewind. -->
    <div id="transport-group" class="hidden">
        <button id="rev-btn" title="Play in reverse">⏪ REV</button>
        <input id="scrubber" type="range" min="0" max="0" value="0" step="1" aria-label="Animation position" />
        <span id="scrub-label">0 / 0</span>
    </div>

    <!-- MAIN -->
    <div id="main">

        <!-- GRAPH CANVAS -->
        <div id="graph-container">
            <button id="clear-graph-btn" title="Clear graph">✕ CLEAR</button>

            <!-- Colour legend for algorithm highlights -->
            <div id="legend" aria-hidden="true">
                <span class="legend-item"><i class="swatch" style="background:#3b82f6"></i>NODE</span>
                <span class="legend-item"><i class="swatch" style="background:#f59e0b"></i>VISITED</span>
                <span class="legend-item"><i class="swatch" style="background:#10b981"></i>CURRENT</span>
                <span class="legend-item"><i class="swatch-line" style="background:#bc5dcb"></i>ACTIVE EDGE</span>
                <span class="legend-item"><i class="swatch-line" style="background:#ef4444"></i>NEG. CYCLE</span>
            </div>

            <svg id="graph-svg">
                <defs>
                    <marker id="arrowhead" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse">
                        <polygon points="0 0, 14 6, 0 12" fill="#666666" />
                    </marker>
                </defs>
                <g id="edges-layer"></g>
                <g id="nodes-layer"></g>
            </svg>
        </div>

        <!-- RESULT PANEL -->
        <div id="result-panel">
            <div id="result-panel-header">
                <span>OUTPUT</span>
                <button id="clear-btn">CLEAR</button>
            </div>
            <div id="result-content">
                <p class="result-empty">Run an algorithm<br>to see results here.</p>
            </div>
        </div>

    </div>

    <!-- STATUS BAR -->
    <div id="statusbar">
        <span class="status-item">NODES <b id="stat-nodes">0</b></span>
        <span class="status-item">EDGES <b id="stat-edges">0</b></span>
        <span class="status-item">LEFT CLICK — add node &nbsp;·&nbsp; RIGHT DRAG — add/remove edge &nbsp;·&nbsp; RIGHT CLICK node — remove</span>
    </div>

    <!-- WEIGHT MODAL -->
    <div id="weight-modal">
        <div id="weight-modal-box">
            <h6>EDGE WEIGHT</h6>
            <input id="weight-input" type="number" min="1" placeholder="Enter weight..." autofocus />
            <div class="modal-btns">
                <button id="weight-confirm">CONFIRM</button>
                <button id="weight-cancel">CANCEL</button>
            </div>
        </div>
    </div>

    <script src="node_modules/d3/dist/d3.min.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/playback.js"></script>
    <script src="js/dijkstra.js"></script>
    <script src="js/bellman_ford.js"></script>
    <script src="js/kruskal.js"></script>
    <script src="js/prim.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
