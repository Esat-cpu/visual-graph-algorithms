<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#0a0f1e"/>
  <!-- küçük → orta (mavi) -->
  <line x1="16" y1="24" x2="22" y2="17" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
  <!-- orta (mavi) → büyük -->
  <line x1="20" y1="15" x2="11" y2="10" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Sol üst — büyük, yeşil -->
  <circle cx="8" cy="9" r="6" fill="#1e2a3a" stroke="#4caf50" stroke-width="1.2"/>
  <!-- Sağ — orta boy, mavi çerçeveli -->
  <circle cx="23" cy="17" r="5" fill="#0d47a1" stroke="#42a5f5" stroke-width="1.4"/>
  <!-- Orta alt — küçük, gri -->
  <circle cx="16" cy="26" r="3.5" fill="#1e2a3a" stroke="#9e9e9e" stroke-width="1"/>
</svg>
